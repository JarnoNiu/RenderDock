; RenderDock desk display: firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.16.
; Build:  pio run          Flash (board on USB):  pio run -t upload
;
; Everything comes from PlatformIO's own registry: the `espressif32` platform (Espressif's Arduino
; framework and compiler) and the libraries below.

[platformio]
default_envs = waveshare-s3-amoled-216

[env:waveshare-s3-amoled-216]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; Three megabytes for the program, twelve for the fonts (see partitions.csv).
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    ; File names that end up inside the program (in assertion messages) lose the builder's home folder,
    ; so a published file does not carry anyone's user name.
    -fmacro-prefix-map=${sysenv.HOME}/=
    -fmacro-prefix-map=/${sysenv.HOME}/=
lib_deps =
    moononournation/GFX Library for Arduino
    lewisxhe/SensorLib
    lewisxhe/XPowersLib
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2

; The same firmware with a serial console, for bringing a board up: a log of what it does, a dump of the frame
; it has drawn, and a way to hand it snapshots over USB without Bluetooth. Not for everyday use.
;   pio run -e debug -t upload
[env:debug]
extends = env:waveshare-s3-amoled-216
build_flags =
    ${env:waveshare-s3-amoled-216.build_flags}
    -DRD_DEBUG_SERIAL=1

